name: Manual signed side-by-side comparison build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        platform: [phone, watch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore fixtures and private signing material
        env:
          FIXTURE_KEY: ${{ secrets.FIXTURE_KEY }}
          KS: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS"
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/morphe.p12"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FIXTURE_KEY -in tools/parity/reference-${{ matrix.platform }}.enc -out original.apk
      - name: Build signed comparison APK
        env:
          MORPHE_KEYSTORE_FILE: ${{ runner.temp }}/morphe.p12
          MORPHE_STORE_PASSWORD: ${{ secrets.MORPHE_KEY_PASSWORD }}
          MORPHE_KEY_ALIAS: morphe
          MORPHE_KEY_PASSWORD: ${{ secrets.MORPHE_KEY_PASSWORD }}
        run: |
          MOD=app; [ '${{ matrix.platform }}' != watch ] || MOD=wear
          gradle :$MOD:assembleRelease --no-daemon
          mkdir -p evidence
          cp $MOD/build/outputs/apk/release/*.apk Wathkkir-${{ matrix.platform }}-test.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs Wathkkir-${{ matrix.platform }}-test.apk | tee evidence/cert.txt
          grep -qi '0a8b609561f299eaba4518c57e558d506e3991bd0ac551cc167716241adad55f' evidence/cert.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.platform == 'phone' && 34 || 33 }}
          arch: x86_64
          target: ${{ matrix.platform == 'phone' && 'google_apis' || 'android-wear' }}
          profile: ${{ matrix.platform == 'phone' && 'pixel_6' || 'wearos_large_round' }}
          disable-animations: true
          script: bash tools/parity/compare_install.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wathkkir-${{ matrix.platform }}-signed-comparison
          path: |
            Wathkkir-*-test.apk
            evidence
          retention-days: 14
      - if: always()
        run: rm -f "$RUNNER_TEMP/morphe.p12" original.apk
