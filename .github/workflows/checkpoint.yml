name: Focused phone and watch parity checkpoint
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to verify
        default: '["phone", "watch"]'
        type: choice
        options:
          - '["phone", "watch"]'
          - '["phone"]'
          - '["watch"]'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare test APKs
        env:
          FIXTURE_KEY: ${{ secrets.FIXTURE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FIXTURE_KEY -in tools/parity/reference-${{ matrix.platform }}.enc -out ${{ matrix.platform }}-original.apk
          if [ '${{ matrix.platform }}' = phone ]; then
            gradle :app:assembleDebug :widgethost:assembleDebug --no-daemon -q
            cp app/build/outputs/apk/debug/*.apk phone-rebuilt.apk
            cp widgethost/build/outputs/apk/debug/*.apk widgethost.apk
          else
            gradle :wear:assembleDebug --no-daemon -q
            cp wear/build/outputs/apk/debug/*.apk watch-rebuilt.apk
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.platform == 'phone' && 34 || 33 }}
          arch: x86_64
          target: ${{ matrix.platform == 'phone' && 'google_apis' || 'android-wear' }}
          profile: ${{ matrix.platform == 'phone' && 'pixel_6' || 'wearos_large_round' }}
          disable-animations: false
          script: python3 -u tools/parity/focused_checkpoint.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-${{ matrix.platform }}
          path: evidence
          retention-days: 7
