name: Manual phone interaction comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build test-only comparison and restore reference
        env:
          FIXTURE_KEY: ${{ secrets.FIXTURE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FIXTURE_KEY -in tools/parity/reference-phone.enc -out original.apk
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          gradle :app:assembleDebug :widgethost:assembleDebug -PwithVerification --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
          cp app/build/outputs/apk/debug/*.apk comparison.apk
          cp widgethost/build/outputs/apk/debug/*.apk widgethost.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: python3 -u tools/parity/location_capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-interaction-evidence
          path: |
            evidence
            app/build/test-results
          retention-days: 7
      - if: always()
        run: rm -f original.apk
