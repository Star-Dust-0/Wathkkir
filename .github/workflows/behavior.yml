name: Manual stateful phone comparison
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Parity script under tools/parity, without .py'
        required: true
        type: string
        default: 'phone_converter_manual'
      minified:
        description: 'Build the comparison app as a signed minified release'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build test-only comparison and restore reference
        env:
          FIXTURE_KEY: ${{ secrets.FIXTURE_KEY }}
          MINIFIED: ${{ inputs.minified }}
          WATHKKIR_KEYSTORE_BASE64: ${{ secrets.WATHKKIR_KEYSTORE_BASE64 }}
          WATHKKIR_STORE_PASSWORD: ${{ secrets.WATHKKIR_STORE_PASSWORD }}
          WATHKKIR_KEY_PASSWORD: ${{ secrets.WATHKKIR_KEY_PASSWORD }}
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
          MORPHE_KEY_PASSWORD: ${{ secrets.MORPHE_KEY_PASSWORD }}
        run: |
          set -e
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FIXTURE_KEY -in tools/parity/reference-phone.enc -out original.apk
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          if [ "$MINIFIED" = "true" ]; then
            gradle :app:assembleRelease :widgethost:assembleDebug -PwithVerification -PcompareSuffix --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
            KS_B64="${WATHKKIR_KEYSTORE_BASE64:-$MORPHE_KEYSTORE_BASE64}"
            KS_PASS="${WATHKKIR_STORE_PASSWORD:-$MORPHE_KEY_PASSWORD}"
            KEY_PASS="${WATHKKIR_KEY_PASSWORD:-$KS_PASS}"
            if [ -z "$KS_B64" ]; then echo "no keystore secret set"; exit 1; fi
            echo "$KS_B64" | base64 -d > release.keystore
            ALIAS=$(keytool -list -keystore release.keystore -storepass "$KS_PASS" 2>/dev/null | grep -i 'PrivateKeyEntry' | head -1 | cut -d, -f1)
            BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
            "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks release.keystore --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$ALIAS" --out comparison.apk aligned.apk
            rm -f release.keystore aligned.apk
          else
            gradle :app:assembleDebug :widgethost:assembleDebug -PwithVerification -PcompareSuffix --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
            cp app/build/outputs/apk/debug/*.apk comparison.apk
          fi
          cp widgethost/build/outputs/apk/debug/*.apk widgethost.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: |
            case "$SCRIPT" in (*[!a-z0-9_]*|"") echo "invalid script name"; exit 1;; esac
            exec python3 -u "tools/parity/$SCRIPT.py"
        env:
          SCRIPT: ${{ inputs.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-stateful-evidence
          path: |
            evidence
            app/build/test-results
          retention-days: 7
      - if: always()
        run: rm -f original.apk
