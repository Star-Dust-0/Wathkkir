name: Manual parity script
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Parity script under tools/parity, without .py'
        required: true
        type: string
      target:
        description: 'Emulator target'
        required: true
        type: choice
        options: [phone, wear]
        default: phone
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build comparison apps and restore reference
        env:
          FIXTURE_KEY: ${{ secrets.FIXTURE_KEY }}
          SCRIPT: ${{ inputs.script }}
          TARGET: ${{ inputs.target }}
        run: |
          set -e
          case "$SCRIPT" in (*[!a-z0-9_]*|"") echo "invalid script name"; exit 1;; esac
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          if [ "$TARGET" = "wear" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FIXTURE_KEY -in tools/parity/reference-watch.enc -out watch-original.apk
            gradle :wear:assembleDebug :widgethost:assembleDebug :tilehost:assembleDebug -PwithWear -PwithVerification -PcompareSuffix --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
            cp wear/build/outputs/apk/debug/*.apk watch-rebuilt.apk
            cp widgethost/build/outputs/apk/debug/*.apk widgethost.apk
            cp tilehost/build/outputs/apk/debug/*.apk tilehost.apk
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FIXTURE_KEY -in tools/parity/reference-phone.enc -out original.apk
            gradle :app:assembleDebug :widgethost:assembleDebug -PwithVerification -PcompareSuffix --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
            cp app/build/outputs/apk/debug/*.apk comparison.apk
            cp widgethost/build/outputs/apk/debug/*.apk widgethost.apk
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: inputs.target == 'phone'
        env:
          SCRIPT: ${{ inputs.script }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: python3 -u "tools/parity/$SCRIPT.py"
      - uses: reactivecircus/android-emulator-runner@v2
        if: inputs.target == 'wear'
        env:
          SCRIPT: ${{ inputs.script }}
        with:
          api-level: 33
          arch: x86_64
          target: android-wear
          profile: wearos_large_round
          disable-animations: false
          script: python3 -u "tools/parity/$SCRIPT.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-evidence-${{ inputs.script }}
          path: evidence
          retention-days: 7
      - if: always()
        run: rm -f original.apk watch-original.apk
