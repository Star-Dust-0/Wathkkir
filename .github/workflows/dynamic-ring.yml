name: Manual Wear OS 6 dynamic ring reference-host test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dynamic-ring:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare rebuilt debug test APK
        run: |
          gradle :wear:assembleDebug :wear:testDebugUnitTest --no-daemon -q
          cp wear/build/outputs/apk/debug/*.apk watch-rebuilt.apk
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: android-wear-signed
          profile: wearos_large_round
          disable-animations: false
          script: python3 -u tools/parity/dynamic_ring.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-dynamic-ring-evidence
          path: evidence
          retention-days: 7
