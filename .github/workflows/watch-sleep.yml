name: Manual watch deep-sleep comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch-sleep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare original and rebuilt APKs
        env:
          FIXTURE_KEY: ${{ secrets.FIXTURE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FIXTURE_KEY -in tools/parity/reference-watch.enc -out watch-original.apk
          gradle :wear:assembleDebug :wear:testDebugUnitTest --no-daemon -q
          cp wear/build/outputs/apk/debug/*.apk watch-rebuilt.apk
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: android-wear
          profile: wearos_large_round
          disable-animations: false
          script: python3 -u tools/parity/watch_sleep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-deep-sleep-evidence
          path: evidence
          retention-days: 7
