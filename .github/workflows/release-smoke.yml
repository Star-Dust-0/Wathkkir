name: Verify a built phone release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of the signed phone release build to verify'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: signed-phone-release
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: |
            exec python3 -u tools/parity/phone_release_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-evidence
          path: evidence
          retention-days: 7
